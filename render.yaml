services:
  - type: worker
    name: jatx-telegram-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false          # Render dashboard mein manually daalo
      - key: OWNER_ID
        value: "8226637107"
      - key: OWNER_USERNAME
        value: "@YourUsername"  # Apna username yahan daalo
